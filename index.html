<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Yard MP · Quality Picking Simulation</title>
<style>
  :root{ color-scheme:light;
    --navy:#14142a; --navy2:#20223f; --purple:#6347FF; --teal:#38BAB9; --ink:#1c1f2e;
    --bg:#eceef7; --panel:#fff; --line:#e5e7f0; --muted:#8b90a8;
    --qlow:#e5484d; --qmid:#8b93a7; --qhigh:#2fa56a;
    --r:16px; --sh:0 10px 28px rgba(20,25,60,.10); --sh2:0 2px 10px rgba(20,25,60,.07); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Figtree','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);
    background:radial-gradient(1100px 560px at 18% -12%, #f8f9ff, transparent), radial-gradient(900px 460px at 102% -4%, #ecf7f6, transparent), var(--bg)}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:5px 14px;color:#fff;
    background:linear-gradient(118deg, var(--navy), var(--navy2));box-shadow:0 2px 14px rgba(10,12,30,.28);z-index:5}
  .brandwrap{display:flex;align-items:center;gap:10px}
  .hlogo{width:26px;height:26px;border-radius:8px;background:#fff;padding:3px;display:inline-flex;box-shadow:0 3px 10px rgba(0,0,0,.28)}
  .hlogo img{width:100%;height:100%;object-fit:contain}
  header h1{font-size:13.5px;margin:0;font-weight:800;line-height:1.1;letter-spacing:.2px}
  .hsub{font-size:10px;color:#a9aed0;font-weight:600;margin-top:1px}
  .controls{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
  button{font:inherit;font-size:12px;border:0;border-radius:9px;padding:5px 9px;cursor:pointer;font-weight:700;background:var(--purple);color:#fff;
    transition:transform .08s ease, box-shadow .15s, background .15s;box-shadow:0 4px 12px rgba(99,71,255,.38)}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  button.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
  button.ghost:hover{background:rgba(255,255,255,.2)}
  .modes{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:3px;gap:2px}
  .modes button{background:transparent;color:#c5c9e6;padding:5px 10px;box-shadow:none;font-weight:700}
  .modes button:hover{color:#fff;transform:none}
  .modes button.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.22)}
  #lang{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
  #lang:hover{background:rgba(255,255,255,.2)}
  #era{background:var(--teal);color:#04302f;box-shadow:none}
  #era.before{background:#f0a020;color:#3a2400}
  .mlab{position:absolute;border:2px solid #f0a020;border-radius:14px;background:#1A1A2E;color:#fff;padding:8px 8px 10px;text-align:center;box-shadow:0 8px 22px rgba(240,160,32,.32);overflow:hidden;z-index:6}
  .mlab .mtitle{font-size:11px;font-weight:800;color:#f5b74a;letter-spacing:.2px}
  .mlab .mtimer{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;margin-top:2px}
  .mlab .msub{font-size:10px;color:#c9cde6;margin-top:1px}
  .mlab .mbar{height:4px;background:#2a2c47;border-radius:3px;margin-top:6px;overflow:hidden}
  .mlab .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a020,#e5484d)}
  .backlog{position:absolute;background:#e5484d;color:#fff;font-weight:900;font-size:14px;padding:3px 10px;border-radius:999px;box-shadow:0 3px 10px rgba(229,72,77,.55);z-index:9;white-space:nowrap;border:2px solid #fff}
  .backlog.bump{animation:blbump .3s ease}
  @keyframes blbump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  .counters{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:8px 11px;z-index:7;min-width:170px}
  .counters .ct-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:11px;font-weight:700;color:var(--muted)}
  .counters .ct-row b{font-size:16px;font-weight:900;color:var(--purple)}
  .counters .ct-row.warn b{color:#e5484d}
  .controls label{font-size:12px;opacity:.9;display:flex;align-items:center;gap:7px;font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;width:92px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--teal);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--teal);cursor:pointer}
  .stats{display:flex;gap:14px;padding:5px 16px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap;align-items:center}
  .stat{color:var(--muted);font-weight:600} .stat b{color:var(--purple);font-weight:800}
  #phase{font-weight:800;padding:3px 12px;border-radius:20px;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .phase-store{background:#e8f7ff;color:#0f6ea8} .phase-buffer{background:#eef0ff;color:#4b3fd6} .phase-consume{background:#eafaf0;color:#1c7a4a}
  .qlegend{display:flex;align-items:center;gap:9px;font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
  .qbar{width:150px;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--qlow),var(--qmid),var(--qhigh));box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  /* scan station + quality graph (ported) */
  .scanzone{position:absolute;border:2px solid var(--teal);border-radius:14px;background:#1A1A2E;color:#fff;padding:8px 8px 10px;text-align:center;box-shadow:0 8px 22px rgba(99,71,255,.35);overflow:hidden;z-index:6}
  .scanzone .sbrand{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.2px}
  .scanzone .sbrand b{color:var(--teal)}
  .scanzone .sbrand .lg{width:18px;height:18px;background:#fff;border-radius:5px;padding:2px;display:inline-flex}
  .scanzone .sbrand .lg img{width:100%;height:100%;object-fit:contain}
  .scanzone .sico{font-size:24px;line-height:1;margin-top:3px}
  .scanzone .slabel{font-size:11px;color:#c9cde6;font-weight:700;margin-top:1px}
  .scanzone .sweep{position:absolute;left:6px;right:6px;top:6px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--teal),var(--purple),transparent);opacity:0;box-shadow:0 0 12px var(--teal)}
  .scanzone.scanning .sweep{animation:scanSweep .6s ease-in-out}
  @keyframes scanSweep{0%{top:6px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 9px);opacity:0}}
  #scanflash{position:absolute;border-radius:12px;background:radial-gradient(circle,rgba(56,186,185,.55),rgba(99,71,255,.35));opacity:0;transition:opacity .12s;pointer-events:none;z-index:36;box-shadow:0 0 20px rgba(56,186,185,.7)}
  .qcard{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;z-index:7}
  .qcard .qt{font-weight:800;font-size:15px;letter-spacing:.1px} .qcard .qs{font-size:11px;color:var(--muted);max-width:520px;line-height:1.3;margin-top:2px}
  .qcard canvas{display:block;margin-top:6px}
  #stageWrap{flex:1;overflow:auto;position:relative}
  #stage{position:relative;transform-origin:top left}
  #factory{position:absolute;text-align:center}
  #factory .ico{font-size:62px;line-height:1}
  #factory .rec{font-size:28px;margin-top:-10px}
  #factory .lbl{font-weight:800;color:var(--navy);font-size:12px;margin-top:2px}
  .feedwrap{position:absolute;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
  .feed{display:flex;flex-wrap:nowrap;gap:3px;width:230px;height:20px;margin-top:6px;overflow:hidden}
  .fmini{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);flex:0 0 auto}
  .bufzone{position:absolute;border:1.5px dashed var(--teal);border-radius:var(--r);background:rgba(56,186,185,.07)}
  .bufzone .bt{position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 8px;font-size:10px;font-weight:800;color:#1f8a89;text-transform:uppercase;letter-spacing:.6px}
  .bufzone.messy{border:2px dashed #d1854a;border-radius:20px 8px 24px 10px;background:rgba(229,72,77,.05)}
  .bufzone.messy .bt{color:#c76a12}
  .truckzone{position:absolute;border:1.5px dashed #cfd4e6;border-radius:var(--r);color:var(--muted);font-size:11px;padding:8px 10px;font-weight:700}
  .arrow{position:absolute;color:#8890b5;font-size:12px}
  .arrow .line{height:2px;background:#c3c8de;position:relative;margin-top:6px;width:150px}
  .arrow .line.l:after{content:'';position:absolute;left:-1px;top:-4px;border:5px solid transparent;border-right-color:#c3c8de}
  .island-label{position:absolute;font-weight:800;color:var(--purple);font-size:15px;letter-spacing:.3px}
  .fila-label{position:absolute;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .slot{position:absolute;border:1px dashed #d7dbe8;border-radius:8px;background:rgba(255,255,255,.4)}
  .bslot{position:absolute;border:1px dashed #9bd8d7;border-radius:8px}
  .qtitle{position:absolute;font-size:12px;color:#6b7186}
  .carga{position:absolute;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(20,25,60,.18);
    transition:left var(--mv) cubic-bezier(.45,.05,.25,1), top var(--mv) cubic-bezier(.45,.05,.25,1), opacity .3s;}
  .carga .pacas{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px;max-width:54px}
  .carga .pacas i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.4);transition:background .2s, transform .2s}
  .carga .pacas i.on{background:rgba(255,255,255,.95);transform:scale(1.05)}
  .carga .qmini{position:absolute;top:3px;right:6px;font-size:10px;font-weight:800;color:#c9cde6}
  .carga .pacas i.samp{box-shadow:0 0 0 1px rgba(255,255,255,.7);transform:scale(1.08)}
  .fly{position:absolute;border-radius:3px;box-shadow:0 1px 2px rgba(20,25,60,.3);border:1px solid rgba(0,0,0,.15);z-index:35;
    transition:left var(--mv) cubic-bezier(.45,.05,.25,1), top var(--mv) cubic-bezier(.45,.05,.25,1), opacity .25s;}
  #fork{position:absolute;z-index:40;pointer-events:none;transition:left var(--mv) linear, top var(--mv) linear;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  #truck{position:absolute;z-index:20;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
  .legend{position:absolute;font-size:11px;color:#8890b5}
  .driver{position:absolute;width:214px;border-radius:18px;background:#1A1A2E;color:#fff;overflow:hidden;border:1px solid #2a2c47;box-shadow:0 10px 26px rgba(20,25,60,.28)}
  .driver .bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;font-size:11px;color:#c9cde6;background:#141428}
  .driver .bar .brand{font-weight:800;letter-spacing:.2px}
  .driver .bar .brand .logo{width:24px;height:24px;display:inline-block;vertical-align:middle;margin-right:7px;background:#fff;border-radius:6px;padding:2px}
  .driver .bar .brand .logo svg{display:block;width:100%;height:100%}
  .driver .bar .live{width:8px;height:8px;border-radius:50%;background:#38BAB9;display:inline-block;margin-left:6px;vertical-align:middle}
  .driver .brand b{color:#38BAB9;font-style:normal}
  .driver .body{padding:12px 14px 14px;min-height:120px}
  .driver .task{display:inline-block;background:#6347FF;color:#fff;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .driver .chip{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
  .driver .chipbox{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .driver .chipbox .pac{display:flex;gap:2px;margin-top:2px}
  .driver .chipbox .pac i{width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.92)}
  .driver .big{font-size:15px;font-weight:800}
  .driver .row{font-size:12px;margin-top:5px;line-height:1.35;color:#e7e9f5}
  .driver .lab{color:#38BAB9;font-weight:700}
  .driver .arrow{color:#6b7186;margin:3px 0;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandwrap"><span class="hlogo" id="hLogo"></span><div><h1 id="hTitle">Yard MP</h1><div class="hsub" id="sub"></div></div></div>
    <div class="controls">
      <div class="modes">
        <button id="mStore" class="active"></button>
        <button id="mBuffer"></button>
        <button id="mConsume"></button>
      </div>
      <button id="era" title="Toggle Safi AI"></button>
      <button id="lang" title="Language">ES</button>
      <button id="play"></button>
      <button class="ghost" id="reset"></button>
      <label><span id="lblSpeed">Speed</span> <input type="range" id="speed" min="0.5" max="16" step="0.5" value="1"></label>
      <span id="spd" style="font-size:12px;opacity:.8;width:38px">1.0×</span>
    </div>
  </header>
  <div class="stats">
    <div class="qlegend"><span id="lblQuality">Quality:</span> <span id="lblLow">Low</span> <span class="qbar"></span> <span id="lblHigh">High</span> <span id="lblGrey" style="color:#8b93a7">· grey = intermediate</span></div>

  <div id="stageWrap"><div id="stage"></div></div>
</div>

// ---------- mapping ----------
function posFor(gidx){
  const ii=Math.floor(gidx/CAP), within=gidx%CAP, f=Math.floor(within/SLOTS_PER_FILA), col=within%SLOTS_PER_FILA;
  return { x: slotX(col)+(SLOT_W-8-CARGA_W)/2, y: islaTop[ISLANDS[ii].id]+f*FILA_PITCH+(SLOT_H-CARGA_H)/2 };
}
function centerOf(gidx){ const p=posFor(gidx); return {x:p.x+CARGA_W/2-FLY/2, y:p.y+CARGA_H/2-FLY/2}; }
function slotX(col){ return YARD_X0+col*SLOT_W; }
function bufPos(i){ return {x:BUF_X+(150-CARGA_W)/2-14, y:BUF_Y0+i*BUF_PITCH}; }
function bufCenter(i){ const p=bufPos(i); return {x:p.x+CARGA_W/2-FLY/2, y:p.y+CARGA_H/2-FLY/2}; }
function factCenter(){ return {x:FACT_INTAKE.x+CARGA_W/2-FLY/2, y:FACT_INTAKE.y+CARGA_H/2-FLY/2}; }
function boxCenterYard(g){ const p=posFor(g); return {x:p.x+CARGA_W/2, y:p.y+CARGA_H/2}; }
function boxCenterBuf(i){ const p=bufPos(i); return {x:p.x+CARGA_W/2, y:p.y+CARGA_H/2}; }
function fork(){ return document.getElementById('fork'); }

  return `<div class="chipbox" style="background:${color};width:54px;height:40px"><div class="pac">${p}</div></div>`; }
function baleChipHTML(color){ return `<div class="chipbox" style="background:${color};width:32px;height:32px"></div>`; }
function chipUnknownHTML(){ return `<div class="chipbox" style="background:${Q_UNKNOWN};width:54px;height:40px;font-size:18px">?</div>`; }
function driverScan(){ const t=L(); setDriverBody(`<div class="task">${t.dScan}</div><div class="chip">${chipUnknownHTML()}<div class="big">📱 ${t.dScanning}</div></div>`); }
function driverMaterial(c){ const t=L(); setDriverBody(`<div class="task">${t.dScan}</div><div class="chip">${chipHTML(c.color,c.n)}<div class="big">${t.dMaterial}: ${t.qn[c.q]}</div></div>`); }
function driverManual(){ const t=L(); setDriverBody(`<div class="task" style="background:#c76a12">${t.dManual}</div><div class="chip">${chipUnknownHTML()}<div class="big">🔬 ${t.manualQC}</div></div><div class="row"><span class="lab">${t.noQuality}</span></div>`); }
async function flashScan(){ const z=document.getElementById('scanzone'); if(z){ z.classList.remove('scanning'); void z.offsetWidth; z.classList.add('scanning'); } const f=document.getElementById('scanflash'); if(!f) return; f.style.opacity='1'; await wait(moveMs()*0.4); f.style.opacity='0'; }
function setDriverBody(h){ const b=document.getElementById('driverBody'); if(b) b.innerHTML=h; }
function driverIdle(){ const t=L(); setDriverBody(`<div class="task" style="background:#3a3c5c">${t.dIdle}</div>`); }
function driverStore(g){ const t=L(); const c=cargas[g];
  setDriverBody(`<div class="task">${t.dStore}</div><div class="chip">${chipHTML(c.color,c.n)}<div class="big">${t.load} ${c.id}</div></div>`+

  setDriverBody(`<div class="task">${t.dConsume}</div><div class="chip">${baleChipHTML(color)}<div class="big">${t.slot} ${slotNum}</div></div>`+

// ---------- helpers ----------
function moveMs(){ return Math.max(42, Math.round(BASE_MOVE/speedMult)); }
function place(el,x,y){ el.style.left=x+'px'; el.style.top=y+'px'; }
function placeInstant(el,x,y){ el.style.transition='none'; place(el,x,y); void el.offsetWidth; el.style.transition=''; }
function setMoveVars(){ document.querySelectorAll('.carga,.fly,#fork').forEach(e=>e.style.setProperty('--mv',moveMs()+'ms')); }
const wait=ms=>new Promise(r=>setTimeout(r,ms/speedMult));
async function ensureRunning(){ if(!running){ await new Promise(r=>{paused_resolve=r;}); } }
const alive=id=>id===runId;
const FORK_W=54, FORK_H=40;
function parkFork(cx,cy,side){ const f=fork();
  if(side==='R'){ f.style.transform='scaleX(1)'; place(f, cx+14, cy-FORK_H/2); }
  else { f.style.transform='scaleX(-1)'; place(f, cx-14-FORK_W, cy-FORK_H/2); } }
async function moveForkTo(cx,cy,side){ parkFork(cx,cy,side); await wait(moveMs()); }

function renderCargaKnown(c){ const t=L(); c.el.style.background=c.color;
  let dots=''; for(let i=0;i<c.n;i++) dots+='<i></i>';
  const title = c.origin ? `${t.isla} ${c.origin} · C${c.id}` : `${t.load} ${c.id}`;
  c.el.innerHTML=`<div>${title}</div><div class="pacas">${dots}</div>`; c.dots=[...c.el.querySelectorAll('.pacas i')]; refreshDots(c); }
function renderCargaUnknown(c){ c.el.style.background=Q_UNKNOWN_HATCH;   // a load with bales, quality unknown
  let dots=''; for(let i=0;i<c.n;i++) dots+='<i></i>';
  c.el.innerHTML=`<span class="qmini">?</span><div class="pacas">${dots}</div>`;
  c.dots=[...c.el.querySelectorAll('.pacas i')]; }
function renderCargaHalf(c){ if(c.dots&&c.dots[0]){ c.dots[0].style.background=c.color; c.dots[0].classList.add('samp'); } }  // manual result: ONE bale of the load known
function makeLoadEl(c){
  const el=document.createElement('div'); el.className='carga';
  el.style.width=CARGA_W+'px'; el.style.height=CARGA_H+'px'; el.style.setProperty('--mv',moveMs()+'ms');
  stage.appendChild(el); c.el=el; renderCargaKnown(c); return el;
}
function refreshDots(c){ if(c.dots) c.dots.forEach((d,i)=>d.classList.toggle('on', i<c.filled)); }
async function animateBalesIn(id,c){ if(!c.dots) return; for(let k=0;k<c.n;k++){ if(!alive(id))return; await ensureRunning(); if(!alive(id))return; c.filled=k+1; refreshDots(c); await wait(90); } }
function makeFly(color){ const el=document.createElement('div'); el.className='fly';
  el.style.width=FLY+'px'; el.style.height=FLY+'px'; el.style.background=color; el.style.setProperty('--mv',moveMs()+'ms');
  stage.appendChild(el); return el; }
function seededRandom(s){ return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

function genCargas(){ cargas=[]; totalBales=0; seq=0; const rnd=seededRandom(20260720);
  for(let g=0;g<TOTAL;g++){ const n=1+Math.floor(rnd()*3); const q=Math.floor(rnd()*3); seq++;
    cargas.push({id:seq,q,color:QUAL[q].c,n,filled:0,el:null,dots:[]}); totalBales+=n; }
  const bFirst=CAP; cargas[bFirst].q=1; cargas[bFirst].color=QUAL[1].c; }   // ISLAND B first = grey
function balesInYard(){ let s=0; cargas.forEach(c=>{ if(c.el) s+=c.filled; }); return s; }
function balesInBuffer(){ return buffer.reduce((a,b)=>a+b.filled,0); }
// alternate strictly across islands A→B→C→A→B, taking the oldest available load from each in turn
// follow the FIRST island (A) left → right, taking loads in order
function selectIslandRR(){
  const picks=[];
  for(let g=0; g<CAP && picks.length<BUF_MAX; g++){ if(cargas[g] && cargas[g].el && cargas[g].filled>0) picks.push(g); }
  return picks;
}

// ========== STORING ==========
async function storeLoad(id,g){ return era==='before' ? storeBefore(id,g) : storeAfter(id,g); }

// WITH Safi AI: pick unknown → scan → material revealed → stored (organised)
async function storeAfter(id,g){
  const c=cargas[g]; const p=posFor(g);
  makeLoadEl(c); renderCargaUnknown(c); c.filled=0;
  placeInstant(c.el, TRUCK_BED.x-CARGA_W/2, TRUCK_BED.y-CARGA_H/2); c.el.style.opacity='0'; requestAnimationFrame(()=>c.el.style.opacity='1');
  driverScan();
  await moveForkTo(TRUCK_BED.x,TRUCK_BED.y,'R'); if(!alive(id)){c.el.remove();c.el=null;return;}
  place(c.el, SCAN.x-CARGA_W/2, SCAN.y-CARGA_H/2); await moveForkTo(SCAN.x,SCAN.y,'L'); if(!alive(id)){c.el.remove();c.el=null;return;}
  await wait(moveMs()*0.5); await flashScan();
  renderCargaKnown(c); driverMaterial(c);
  await wait(moveMs()*0.6); if(!alive(id)){c.el.remove();c.el=null;return;}
  driverStore(g);
  place(c.el, p.x, p.y); const bc=boxCenterYard(g); parkFork(bc.x,bc.y,'R'); await wait(moveMs()); if(!alive(id)){c.el.remove();c.el=null;return;}
  await animateBalesIn(id,c); if(!alive(id))return;
  updateStats(); await wait(50);
}

// BEFORE Safi AI: no scan. Only 1 bale is manually sampled (~2 h). Everything else piles up UNKNOWN → trucks + material back up.
async function storeBefore(id,g){
  const c=cargas[g]; const p=posFor(g);
  makeLoadEl(c); renderCargaUnknown(c); c.filled=0; c.state='unknown';   // stays "?" — quality unknown
  placeInstant(c.el, TRUCK_BED.x-CARGA_W/2, TRUCK_BED.y-CARGA_H/2); c.el.style.opacity='0'; requestAnimationFrame(()=>c.el.style.opacity='1');
  driverManual();
  await moveForkTo(TRUCK_BED.x,TRUCK_BED.y,'R'); if(!alive(id)){c.el.remove();c.el=null;return;}
  // dumped straight into the yard, unclassified
  place(c.el, p.x, p.y); const bc=boxCenterYard(g); parkFork(bc.x,bc.y,'R'); await wait(moveMs()*0.7); if(!alive(id)){c.el.remove();c.el=null;return;}
  loadsStored++;
  backlogPhase += 0.16; backlog = Math.round(12 + 7*Math.sin(backlogPhase)); updateBacklog();   // gentle wave 5–19, never over 20
  if(Math.random()<0.12) sampleOneLoad();   // ~every 2 h a manual sample returns → one bale of one load known
  updateCounters();
  updateStats(); await wait(28);   // fast → accumulation
}
// manual sampling returns a result for ONE bale → that load becomes half known / half unknown
function sampleOneLoad(){ const cands=cargas.filter(c=>c&&c.el&&c.state==='unknown'); if(!cands.length) return;
  const c=cands[Math.floor(Math.random()*cands.length)]; c.state='half'; renderCargaHalf(c); updateCounters(); }
function updateCounters(){ const el=document.getElementById('counters'); if(!el) return;
  const noq=cargas.filter(c=>c&&c.el&&c.state==='unknown').length;
  el.innerHTML=`<div class="ct-row"><span>${L().loadsStored}</span><b>${loadsStored}</b></div><div class="ct-row warn"><span>${L().noQuality2}</span><b>${noq}</b></div>`; }
function fmtHMS(s){ const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=Math.floor(s%60); const z=n=>String(n).padStart(2,'0'); return `${z(h)}:${z(m)}:${z(x)}`; }
function updateBacklog(){ const b=document.getElementById('backlog'); if(!b) return;
  b.textContent=`⚠ ${backlog}`;
  b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
function startManualTimer(){ stopManualTimer(); mlabSecs=Math.floor(Math.random()*1200);
  const t=()=>document.getElementById('mtimer'), bar=()=>document.querySelector('#mlab .mbar i');
  mlabTimer=setInterval(()=>{ mlabSecs+=90; if(mlabSecs>=3600) mlabSecs=Math.floor(Math.random()*180);
    const tt=t(); if(tt) tt.textContent=fmtHMS(mlabSecs); const bb=bar(); if(bb) bb.style.width=Math.min(100,(mlabSecs/3600)*100)+'%'; }, 180); }
function stopManualTimer(){ if(mlabTimer){ clearInterval(mlabTimer); mlabTimer=null; } }

// ========== SEND TO BUFFER ==========
// before Safi AI: with no quality data you can't build a good mix — you grab a skewed batch (3 red, 2 green)
function pickBufferBefore(){ const picks=[]; const want=[0,0,0,2,2];   // 3 low(red) + 2 high(green)
  for(const q of want){ for(let g=0; g<cargas.length; g++){ const c=cargas[g]; if(c&&c.el&&c.filled>0&&c.q===q&&!picks.includes(g)){ picks.push(g); break; } } }
  return picks; }
async function sendLoadToBuffer(id,g){
  const c=cargas[g]; const ctr=centerOf(g);
  const unknown=(era==='before' && Math.random()<0.4);   // some material still has no quality result → stays ?
  const bl={id:c.id,q:c.q,color:c.color,n:c.n,filled:0,el:null,dots:[],origin:ISLANDS[Math.floor(g/CAP)].id,unknown};
  makeLoadEl(bl); const bp=bufPos(buffer.length); placeInstant(bl.el,bp.x,bp.y); bl.el.style.opacity='.4'; refreshDots(bl);
  if(era==='before') bl.el.style.transform=`rotate(${(Math.random()*18-9).toFixed(1)}deg) translate(${(Math.random()*12-6).toFixed(0)}px,${(Math.random()*10-5).toFixed(0)}px)`;   // messy pile
  const flyC=unknown?Q_UNKNOWN:c.color;
  buffer.push(bl); driverPick(g, buffer.length);
  for(let k=0;k<c.n;k++){
    if(!alive(id))return; await ensureRunning(); if(!alive(id))return;
    const yc=boxCenterYard(g); await moveForkTo(yc.x,yc.y,'L'); if(!alive(id))return;
    c.filled--; refreshDots(c);
    const fly=makeFly(flyC); place(fly,ctr.x,ctr.y);
    const i=buffer.indexOf(bl), tt=bufCenter(i);
    const bbc=boxCenterBuf(i); place(fly,tt.x,tt.y); parkFork(bbc.x,bbc.y,'L'); await wait(moveMs()); if(!alive(id)){fly.remove();return;}
    fly.style.opacity='0'; setTimeout(()=>fly.remove(),200);
    bl.filled++; bl.el.style.opacity='1'; if(!unknown) refreshDots(bl); updateStats(); await wait(70);
  }
  if(unknown) renderCargaUnknown(bl);   // arrived but no quality result → stays "?"
  c.el.style.opacity='0'; setTimeout(()=>{c.el&&c.el.remove(); c.el=null;},250);
}

// ========== CONSUME ==========
function feedMini(id,q){ const f=document.getElementById(id); if(!f) return; const s=document.createElement('span'); s.className='fmini'; s.style.background=QUAL[q].c; f.appendChild(s); while(f.children.length>11) f.removeChild(f.firstChild); }
function baseAfter(q){ return q===0?78:q===1?80:83; }        // Safi sorted blend → stable ~80
function baseBefore(q){ return q===0?42:q===1?70:96; }       // no sorting → whole bad load then good → big swings
function pushSeries(arr,base){ const last=arr.length?arr[arr.length-1]:base;   // ease from last value → new base for a smooth line
  for(let s=0;s<6;s++){ const target=base+(Math.random()*2-1); let v=last+(target-last)*((s+1)/6)+(Math.random()*1.2-0.6); arr.push(Math.max(2,Math.min(99,v))); }
  if(arr.length>Q_WINDOW) arr.splice(0,arr.length-Q_WINDOW); }
function qReset(){ qA=[]; qB=[]; bIdx=0; wavePhase=Math.random()*6; drawQ(); }
function drawQ(){ const c=document.getElementById('qcanvas'); if(!c) return; const dpr=window.devicePixelRatio||1;
  const w=qCW,h=qCH; if(c.width!==w*dpr){ c.width=w*dpr; c.height=h*dpr; } const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const padL=36,padR=74,padT=26,padB=8, pW=w-padL-padR, pH=h-padT-padB;
  const all=qA.concat(qB); let mn=70,mx=90; if(all.length){ mn=Math.min(Q_TARGET,...all); mx=Math.max(Q_TARGET,...all); }
  mn=Math.max(0,Math.floor((mn-4)/5)*5); mx=Math.min(100,Math.ceil((mx+4)/5)*5); if(mx-mn<10) mx=Math.min(100,mn+10);
  const yFor=v=>padT+(1-(v-mn)/(mx-mn))*pH;
  ctx.font='11px Figtree,system-ui,sans-serif';
  [mx,Math.round((mn+mx)/2),mn].forEach(v=>{ const y=yFor(v); ctx.strokeStyle='#eceef5'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+pW,y); ctx.stroke(); ctx.fillStyle='#aab0c4'; ctx.fillText(v+'%',6,y+4); });
  ctx.fillStyle='rgba(99,71,255,.09)'; ctx.fillRect(padL,yFor(Q_BAND[1]),pW,yFor(Q_BAND[0])-yFor(Q_BAND[1]));
  ctx.strokeStyle='#20233a'; ctx.setLineDash([6,5]); ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(padL,yFor(Q_TARGET)); ctx.lineTo(padL+pW,yFor(Q_TARGET)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#20233a'; ctx.font='700 11px Figtree,system-ui,sans-serif'; ctx.fillText(L().qTargetLbl, padL+pW+6, yFor(Q_TARGET)+4);
  const dx=pW/(Q_WINDOW-1);
  const plot=(arr,color)=>{ const n=arr.length; if(n<2) return; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath(); for(let i=0;i<n;i++){ const x=padL+i*dx, y=yFor(arr[i]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); ctx.fillStyle=color; ctx.beginPath(); ctx.arc(padL+(n-1)*dx,yFor(arr[n-1]),3.4,0,7); ctx.fill(); };
  plot(qB,'#e5484d'); plot(qA,'#3f3ff0');
  const t=L(); ctx.textBaseline='middle'; ctx.font='700 12px Figtree,system-ui,sans-serif';
  ctx.strokeStyle='#3f3ff0'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(padL,12); ctx.lineTo(padL+22,12); ctx.stroke();
  ctx.fillStyle='#20233a'; ctx.fillText(t.qLegA, padL+28, 13);
  const x2=padL+28+ctx.measureText(t.qLegA).width+22;
  ctx.strokeStyle='#e5484d'; ctx.beginPath(); ctx.moveTo(x2,12); ctx.lineTo(x2+22,12); ctx.stroke();
  ctx.fillText(t.qLegB, x2+28, 13); ctx.textBaseline='alphabetic'; }
async function feedBaleAt(id,i){
  const bl=buffer[i];
  driverConsume(i+1, bl.color);
  const bbc=boxCenterBuf(i); await moveForkTo(bbc.x,bbc.y,'L'); if(!alive(id))return;
  bl.filled--; refreshDots(bl);
  const fly=makeFly(bl.color); place(fly,bufCenter(i).x,bufCenter(i).y);
  const fc=factCenter(); place(fly,fc.x,fc.y); parkFork(FACT_INTAKE.x+CARGA_W/2,FACT_INTAKE.y+CARGA_H/2,'L');
  await wait(moveMs()); if(!alive(id)){fly.remove();return;}
  fly.style.opacity='0'; setTimeout(()=>fly.remove(),200);
  toProdB++; feedCount[bl.q]++; feedMini('feed', bl.q);
  pushSeries(qA, baseAfter(bl.q));
  if(era==='before'){ pushSeries(qB, baseBefore(bl.q)); feedMini('feedB', bl.q); }   // actual: greens high, reds low
  else { wavePhase += 0.34+Math.random()*0.55; const bbase=Q_TARGET+(16+8*Math.sin(wavePhase*0.41))*Math.sin(wavePhase); pushSeries(qB, bbase); const bq=bbase<58?0:bbase<78?1:2; feedMini('feedB', bq); }
  drawQ(); updateStats(); await wait(70);
}
async function consumeBuffer(id){
  if(era==='before'){   // no Safi: whole good batch first (very high) then whole bad batch (very low) → big swing
    for(let i=0;i<buffer.length;i++){ const bl=buffer[i];
      while(bl.filled>0){ if(!alive(id))return; await ensureRunning(); if(!alive(id))return; await feedBaleAt(id,i); }
      if(bl.el){ bl.el.style.opacity='0'; setTimeout(()=>bl.el&&bl.el.remove(),250); }
    }
    updateStats(); return;
  }
  while(buffer.some(b=>b.filled>0)){
    for(let i=0;i<buffer.length;i++){ if(buffer[i].filled<=0) continue; if(!alive(id))return; await ensureRunning(); if(!alive(id))return; await feedBaleAt(id,i); }
    const gone=buffer.filter(b=>b.filled<=0);
    gone.forEach(b=>{ b.el.style.opacity='0'; setTimeout(()=>b.el&&b.el.remove(),250); });
    buffer=buffer.filter(b=>b.filled>0);
    buffer.forEach((b,i)=>place(b.el,bufPos(i).x,bufPos(i).y));
    updateStats();
  }
}

// ---------- mode control ----------
function clearAll(){
  buffer.forEach(b=>b.el&&b.el.remove()); cargas.forEach(c=>c.el&&c.el.remove());
  cargas=[]; buffer=[]; toProdB=0; feedCount=[0,0,0];
  const f=document.getElementById('feed'); if(f) f.innerHTML='';
  const fb=document.getElementById('feedB'); if(fb) fb.innerHTML='';
}
function prefillYardFull(){ cargas.forEach((c,g)=>{ makeLoadEl(c); const p=posFor(g); placeInstant(c.el,p.x,p.y); c.filled=c.n; refreshDots(c); }); }

async function startMode(m){
  runId++; const id=runId; mode=m;
  running=true; document.getElementById('play').textContent=L().pause;
  if(paused_resolve){ paused_resolve(); paused_resolve=null; }
  ['mStore','mBuffer','mConsume'].forEach(x=>document.getElementById(x).classList.remove('active'));
  document.getElementById(m==='store'?'mStore':m==='buffer'?'mBuffer':'mConsume').classList.add('active');
  await Promise.resolve(); clearAll();
  const dp=document.getElementById('driver'); if(dp) dp.style.display='block';
  const qc=document.getElementById('qcard'); if(qc) qc.style.display=(m==='consume')?'block':'none';
  if(m==='consume') requestAnimationFrame(qReset); else qReset();
  // stations: manual-sampling lab + backlog only during the "before" storing view
  stopManualTimer();
  const beforeStore=(era==='before' && m==='store');
  const sc=document.getElementById('scanzone'), ml=document.getElementById('mlab'), bk=document.getElementById('backlog'), ct=document.getElementById('counters');
  if(sc) sc.style.display=beforeStore?'none':'block';
  if(ml) ml.style.display=beforeStore?'block':'none';
  if(bk) bk.style.display=beforeStore?'block':'none';
  if(ct) ct.style.display=beforeStore?'block':'none';
  if(beforeStore){ backlogPhase=0; backlog=12; loadsStored=0; updateBacklog(); updateCounters(); startManualTimer(); }
  // before era: the staging area becomes a disorganised "unsorted pile" (buffer + consume)
  const messyBuf=(era==='before' && (m==='store'||m==='buffer'||m==='consume'));
  const bz=document.getElementById('bufzone'), bt2=document.getElementById('bufTitle'), bzl=document.getElementById('bufZoneLbl');
  if(bz) bz.classList.toggle('messy', messyBuf);
  if(bt2){ bt2.style.display=messyBuf?'none':'block'; if(!messyBuf) bt2.textContent=L().stagedMix; }
  if(bzl){ bzl.style.display=messyBuf?'none':'block'; if(!messyBuf) bzl.textContent=L().bufferZone; }
  document.querySelectorAll('.slotlbl').forEach(e=>e.style.display=messyBuf?'none':'block');
  document.querySelectorAll('.bslot').forEach(e=>e.style.opacity=messyBuf?'0':'1');
  place(fork(), TRUCK_BED.x-30, TRUCK_BED.y);

  if(m==='store'){
    genCargas(); initInPlay=totalBales; setPhase('store'); updateStats();
    for(let g=0; g<TOTAL; g++){ if(!alive(id))return; await ensureRunning(); if(!alive(id))return; await storeLoad(id,g); }
  } else if(m==='buffer'){
    genCargas(); prefillYardFull(); initInPlay=totalBales; setPhase('buffer'); updateStats();
    const picks = era==='before' ? pickBufferBefore() : selectIslandRR();   // before: a skewed batch (3 red, 2 green)
    for(const g of picks){ if(!alive(id))return; await ensureRunning(); if(!alive(id))return; await sendLoadToBuffer(id,g); }
  } else {
    genCargas(); prefillYardFull(); buffer=[];
    // before: no Safi → whole green batch then whole red batch (very high, then very low).  after: balanced mix (Safi stays stable ~80)
    const specs = era==='before'
      ? [{q:2,n:5,o:'A'},{q:2,n:5,o:'A'},{q:2,n:4,o:'A'},{q:0,n:5,o:'B'},{q:0,n:5,o:'B'}]
      : [{q:2,n:5,o:'A'},{q:0,n:5,o:'B'},{q:1,n:5,o:'C'},{q:2,n:5,o:'A'},{q:0,n:5,o:'B'}];
    specs.forEach((sp,n)=>{ seq++; const bl={id:seq,q:sp.q,color:QUAL[sp.q].c,n:sp.n,filled:sp.n,el:null,dots:[],origin:sp.o};
      makeLoadEl(bl); const p=bufPos(n); placeInstant(bl.el,p.x,p.y);
      if(era==='before') bl.el.style.transform=`rotate(${(Math.random()*16-8).toFixed(1)}deg) translate(${(Math.random()*10-5).toFixed(0)}px,${(Math.random()*8-4).toFixed(0)}px)`;
      refreshDots(bl); buffer.push(bl); });
    initInPlay=balesInBuffer(); setPhase('consume'); qReset();
    place(fork(), bufPos(0).x-24, bufPos(0).y-12); updateStats();
    await consumeBuffer(id);
  }
}
function setPhase(p){ const el=document.getElementById('phase'); if(!el) return; const t=L();
  if(p==='store'){ el.textContent=t.phaseStore; el.className='phase-store'; }
  else if(p==='buffer'){ el.textContent=t.phaseBuffer; el.className='phase-buffer'; }
  else { el.textContent=t.phaseConsume; el.className='phase-consume'; } }
function updateStats(){ const y=document.getElementById('sInYard'); if(!y) return;
  const t=L(); const inPlay = mode==='consume' ? balesInBuffer() : balesInYard();
  y.textContent=inPlay; document.getElementById('sCap').textContent=initInPlay||0;
  document.getElementById('sBufLoads').textContent=buffer.length;
  document.getElementById('sToProd').textContent=toProdB;
  const tot=feedCount[0]+feedCount[1]+feedCount[2];
  document.getElementById('sMix').textContent = tot? `${feedCount[2]} ${t.green} · ${feedCount[1]} ${t.grey} · ${feedCount[0]} ${t.red}` : '–';
}

// ---------- language ----------
function applyStatic(){
  const t=L();
  document.documentElement.lang=lang;
  document.getElementById('hTitle').textContent=t.title; document.title=t.title;
  const hs=document.getElementById('sub'); if(hs) hs.textContent=t.subtitle||'';
  const hl=document.getElementById('hLogo'); if(hl && !hl.dataset.set){ hl.innerHTML=LOGO_SVG; hl.dataset.set='1'; }
  const qtl=document.getElementById('qTitle'); if(qtl){ qtl.textContent=t.qTitle; const qs=document.getElementById('qSub'); if(qs) qs.textContent=t.qSub; }
  drawQ();
  document.getElementById('mStore').textContent=t.store;
  document.getElementById('mBuffer').textContent=t.buffer;
  document.getElementById('mConsume').textContent=t.consume;
  const eb=document.getElementById('era'); if(eb){ eb.textContent = era==='after'?t.toBefore:t.toAfter; eb.classList.toggle('before', era==='before'); }
  document.getElementById('lang').textContent=t.langBtn;
  document.getElementById('play').textContent=running?t.pause:t.play;
  document.getElementById('reset').textContent=t.reset;
  document.getElementById('lblSpeed').textContent=t.speed;
  document.getElementById('lblQuality').textContent=t.quality;
  document.getElementById('lblLow').textContent=t.low;
  document.getElementById('lblHigh').textContent=t.high;
  document.getElementById('lblGrey').textContent=t.greynote;
}
function setLang(l){ lang=l; applyStatic(); buildScene(); startMode(mode); }
function setEra(e){ era=e; applyStatic(); startMode(mode); }

// ---------- fit / controls ----------
function fitStage(){ const wrap=document.getElementById('stageWrap');
  const sw=stage.offsetWidth||1, scale=Math.min(1,(wrap.clientWidth-24)/sw); stage.style.transform='scale('+scale+')'; }
window.addEventListener('resize',fitStage);
document.getElementById('mStore').onclick=()=>startMode('store');
document.getElementById('mBuffer').onclick=()=>startMode('buffer');
document.getElementById('mConsume').onclick=()=>startMode('consume');
document.getElementById('era').onclick=()=>setEra(era==='after'?'before':'after');
document.getElementById('lang').onclick=()=>setLang(lang==='en'?'es':'en');
document.getElementById('play').onclick=e=>{ running=!running; e.target.textContent=running?L().pause:L().play;
  if(running&&paused_resolve){paused_resolve();paused_resolve=null;} };
document.getElementById('reset').onclick=()=>startMode(mode);
(()=>{ const e=document.getElementById('sBufMax'); if(e) e.textContent=BUF_MAX; })();
document.getElementById('speed').oninput=e=>{ speedMult=parseFloat(e.target.value); document.getElementById('spd').textContent=speedMult.toFixed(1)+'×'; setMoveVars(); };

// ---------- go ----------
applyStatic(); buildScene(); startMode('store');
</script>
